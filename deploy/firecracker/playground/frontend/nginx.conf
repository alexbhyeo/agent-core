server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The frontend is static; the browser calls the backend API directly (cross-origin).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # Revalidate the app on every load so a redeployed frontend is picked up at once.
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
